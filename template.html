<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; object-src 'none'; form-action 'none'; connect-src 'none'">
<title>Ambient panel</title>
<style>
:root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; padding: 0; background: #f5f7fa; color: #24313e; }
.page { max-width: 1060px; margin: 0 auto; padding: clamp(22px,5vw,68px) 20px 48px; }
.top { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:20px; margin-bottom:45px; }
.overline { font-size:12px; text-transform:uppercase; letter-spacing:.19em; color:#658398; font-weight:700; }
h1 { font-size:clamp(31px,5vw,53px); line-height:1.12; letter-spacing:-.052em; margin:13px 0 12px; font-weight:750; }
.sub { font-size:15px; color:#6b7c8c; margin:0; }
.pill { border-radius:50px; border:1px solid #d6e2e8; background:#eaf3f6; padding:10px 15px; font-size:13px; font-weight:600; color:#4c6778; white-space:nowrap; }
.pill.stale { background: #fff1db; color: #9c651c; border-color: #f0d49d; }
.cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
.card { background:#fff; border:1px solid #e4eaf0; box-shadow:0px 10px 25px #172f4510; border-radius:18px; padding:28px; min-height:187px; display:flex; flex-direction:column; justify-content:space-between; }
.label { color:#6e8091; font-size:15px; font-weight:600; }
.val { font-size:clamp(38px,7vw,59px); letter-spacing:-.06em; font-weight:710; line-height:1.08; font-variant-numeric:tabular-nums; }
.unit { font-size:22px; font-weight:500; color:#7991a0; margin-left:6px; letter-spacing:-.02em; }
.divider { height:1px; background:#dde6ee; margin:34px 0 16px; }
.foot { display:flex; justify-content:space-between; flex-wrap:wrap; gap:14px; font-size:13px; color:#788b9c; line-height:1.5; }
.foot strong { color:#4f6273; font-weight:600; }
@media(max-width:580px) { .cards {grid-template-columns:1fr; gap:13px;} .card{min-height:160px; padding:24px;} .top{margin-bottom:28px;} }
@media(prefers-color-scheme:dark) {
  body{background:#10171d;color:#f1f5f8;} .overline{color:#8bb8ce;} .sub{color:#9cabb8;} .pill{background:#1a2c36;color:#aac2d2;border-color:#37505f;} .pill.stale{background:#3a2e1c;color:#f0c581;border-color:#806132;}
  .card{background:#1a252e;border-color:#30414d;box-shadow:none;} .label{color:#abb9c4;} .unit{color:#a6b7c3;} .divider{background:#2b3c49;} .foot{color:#9daeba;} .foot strong{color:#c1d2dc;}
}
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <div>
      <div class="overline">ENVIRONMENTAL MONITORING</div>
      <h1>Ambient panel</h1>
      <p class="sub">Periodic, read-only snapshot of selected sensors.</p>
    </div>
    <div class="pill" id="status">Checking freshness…</div>
  </header>
  <section class="cards" aria-label="Measurements">$cards</section>
  <div class="divider"></div>
  <footer class="foot">
    <div><strong>Snapshot:</strong> <time id="updated-at" datetime="$timestamp_iso">$timestamp_readable</time></div>
    <div>No live access · No controls · No location data</div>
  </footer>
</main>
<script>
(function () {
  'use strict';
  const el = document.getElementById('updated-at');
  const status = document.getElementById('status');
  const stamp = new Date(el.dateTime);
  if (Number.isNaN(stamp.getTime())) { status.textContent='Unknown update time'; status.classList.add('stale'); return; }
  el.textContent = stamp.toLocaleString(undefined, {dateStyle:'medium',timeStyle:'short'});
  function refresh() {
    const age = Math.max(0, (Date.now() - stamp.getTime()) / 60000);
    if (age >= 75) { status.textContent='Data may be outdated'; status.classList.add('stale'); }
    else { status.textContent='Snapshot is current'; status.classList.remove('stale'); }
  }
  refresh();
  setInterval(refresh, 60000);
})();
</script>
</body>
</html>
